name: comporg-agent

services:
  comporg-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: comporg-agent:local
    container_name: comporg-agent-dev
    working_dir: /app
    ports:
      - target: 8000
        published: "8001"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      WATCHFILES_FORCE_POLLING: "true"
    command:
      - python
      - -m
      - uvicorn
      - backend.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
